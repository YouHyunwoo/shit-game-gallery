<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 플레이 - ShitGame Gallery</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/player.css">
</head>
<body>
    <header class="site-header">
        <a href="/" class="btn-back">← 갤러리로</a>
        <span id="game-title" class="game-title-header"></span>
    </header>

    <main id="player-container" class="player-container">
        <div class="loading">게임 로딩 중...</div>
    </main>

    <script type="module">
        import { onAuthChange }
            from './scripts/auth/google-auth.js';
        import { getUserTier }
            from './scripts/subscription/sub-check.js';
        import { loadGame }
            from './scripts/player/game-player.js';
        import { fetchGames, filterByTier }
            from './scripts/gallery/game-list.js';

        const params = new URLSearchParams(location.search);
        const gameId = params.get('id');
        const container = document.getElementById('player-container');

        if (!gameId) {
            container.innerHTML = '<p class="error">게임 ID가 없습니다.</p>';
        } else {
            onAuthChange(async user => {
                try {
                    // 접근 권한 확인
                    const tier = user
                        ? (await getUserTier(user.uid) || 'none')
                        : 'none';

                    const allGames = await fetchGames();
                    const accessible = filterByTier(allGames, tier);
                    const canPlay = accessible.some(g => g.id === gameId);

                    if (!canPlay) {
                        container.innerHTML = `
                            <div class="access-denied">
                                <p>이 게임은 구독자 전용입니다.</p>
                                <a href="/">갤러리로 돌아가기</a>
                            </div>
                        `;
                        return;
                    }

                    const game = await loadGame(gameId, container);
                    document.title = `${game.title} - ShitGame Gallery`;
                    document.getElementById('game-title').textContent =
                        game.title;
                } catch (err) {
                    container.innerHTML =
                        '<p class="error">게임을 불러올 수 없습니다.</p>';
                    console.error(err);
                }
            });
        }
    </script>
</body>
</html>
